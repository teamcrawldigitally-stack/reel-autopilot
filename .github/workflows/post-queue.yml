name: Post queued reels

# Posts the next ready-made reel from queue/astro24x7 once a day, then its trial copy (shown to
# non-followers first) the same evening. Cron is in UTC; GitHub can start scheduled runs a few minutes late.
#   13:17 UTC = 6:47 PM IST  normal post
#   16:17 UTC = 9:47 PM IST  trial copy of the reel that went out normally
on:
  schedule:
    - cron: "17 13 * * *"
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = check token, account and video link, post nothing · post-now = post right away"
        type: choice
        options: [test, post-now]
        default: test
      kind:
        description: "normal = next reel to followers · trial = trial copy of the latest normally posted reel"
        type: choice
        options: [normal, trial]
        default: normal

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cloudflared (temporary video link)
        run: |
          sudo curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Post the next reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: >
          node pipeline/post-queue.mjs --page astro24x7
          --kind ${{ github.event_name == 'schedule' && (github.event.schedule == '17 16 * * *' && 'trial' || 'normal') || inputs.kind }}
          ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' && '--dry-run' || '' }}
          ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'post-now' && '--force' || '' }}

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Posting log: $(date -u +%F)" && git pull --rebase && git push)
