name: Post queued reels

# Posts 2 ready-made reels a day from queue/astro24x7 (perDay in the manifest), each followed 3 hours
# later by a trial copy (shown to non-followers first). Cron is in UTC. GitHub can start runs late or
# drop them when busy, so every slot has two backup start times (+30 and +90 min); a backup only posts
# if that slot's post hasn't gone out yet (--slot).
#   07:17 UTC = 12:47 PM IST  normal post 1   (backups 07:47, 08:47)
#   10:17 UTC =  3:47 PM IST  trial copy 1    (backups 10:47, 11:47)
#   13:17 UTC =  6:47 PM IST  normal post 2   (backups 13:47, 14:47)
#   16:17 UTC =  9:47 PM IST  trial copy 2    (backups 16:47, 17:37)
on:
  schedule:
    - cron: "17 7 * * *"
    - cron: "47 7 * * *"
    - cron: "47 8 * * *"
    - cron: "17 10 * * *"
    - cron: "47 10 * * *"
    - cron: "47 11 * * *"
    - cron: "17 13 * * *"
    - cron: "47 13 * * *"
    - cron: "47 14 * * *"
    - cron: "17 16 * * *"
    - cron: "47 16 * * *"
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = upload and let Instagram process the next reel, publish nothing · post-now = post right away · slot = post only if today's slot N for this kind hasn't gone out yet (used by Claude's on-time starts)"
        type: choice
        options: [test, post-now, slot]
        default: test
      kind:
        description: "normal = next reel to followers · trial = trial copy of the latest normally posted reel"
        type: choice
        options: [normal, trial]
        default: normal
      slot:
        description: "for mode slot: 1 = first post of the day of this kind, 2 = second"
        type: choice
        options: ["1", "2"]
        default: "1"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install cloudflared (temporary video link)
        run: |
          # GitHub's download server sometimes answers 504; retry, then fall back to Cloudflare's own apt repo.
          ok=
          for i in 1 2 3; do sudo curl -fsSL --retry 2 -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && ok=1 && break; sleep $((i * 10)); done
          if [ -n "$ok" ]; then
            sudo chmod +x /usr/local/bin/cloudflared
          else
            curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
            sudo apt-get update -qq && sudo apt-get install -y -qq cloudflared
          fi
          cloudflared --version

      - name: Post the next reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          KIND: ${{ inputs.kind }}
          SLOT: ${{ inputs.slot }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              "17 7 * * *"|"47 7 * * *"|"47 8 * * *")    ARGS="--kind normal --slot 1" ;;
              "17 10 * * *"|"47 10 * * *"|"47 11 * * *") ARGS="--kind trial --slot 1" ;;
              "17 13 * * *"|"47 13 * * *"|"47 14 * * *") ARGS="--kind normal --slot 2" ;;
              "17 16 * * *"|"47 16 * * *"|"37 17 * * *") ARGS="--kind trial --slot 2" ;;
              *) echo "Unknown schedule '$SCHEDULE'"; exit 1 ;;
            esac
          else
            ARGS="--kind $KIND"
            [ "$MODE" = "test" ] && ARGS="$ARGS --dry-run"
            [ "$MODE" = "post-now" ] && ARGS="$ARGS --force"
            [ "$MODE" = "slot" ] && ARGS="$ARGS --slot ${SLOT:-1}"
          fi
          echo "post-queue.mjs $ARGS"
          node pipeline/post-queue.mjs --page astro24x7 $ARGS

      - name: Save what was posted
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Posting log: $(date -u +%F)" && git pull --rebase && git push)
