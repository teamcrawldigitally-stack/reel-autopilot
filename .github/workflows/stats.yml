name: Engagement stats

# Every night at 11:17 PM IST (17:47 UTC) save likes, comments, views (if permitted) per posted reel
# and the follower count to state/astro24x7-stats.json.
on:
  schedule:
    - cron: "47 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect stats
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
        run: node pipeline/stats.mjs --page astro24x7
      - name: Save
        if: always()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Engagement stats: $(date -u +%F)" && git pull --rebase && git push)
