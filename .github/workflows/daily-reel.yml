name: Daily reel

on:
  # Not scheduled yet: the ready-made reels in queue/ are posted by post-queue.yml.
  # When the full daily pipeline (research -> script -> voice -> render) is switched on, move the schedule here.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt
          npx remotion browser ensure

      - name: Research, render and post
        env:
          # Your Claude subscription (Pro/Max), created once with `claude setup-token`. No API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: node pipeline/run-daily.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the run files (video, script, caption) for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: runs/
          retention-days: 14

      - name: Save posting history
        if: success()
        run: |
          git config user.name "reel-autopilot"
          git config user.email "reel-autopilot@users.noreply.github.com"
          git add history/posted.json
          git diff --cached --quiet || (git commit -m "Log today's reel" && git push)
